# Example reverse proxy (TLS termination) in front of the API container.
server {
    listen 443 ssl http2;
    server_name servicedesk.yourcompany.example;
    ssl_certificate     /etc/ssl/certs/servicedesk.crt;
    ssl_certificate_key /etc/ssl/private/servicedesk.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;           # MAX_UPLOAD_MB + overhead
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
server { listen 80; server_name servicedesk.yourcompany.example; return 301 https://$host$request_uri; }
